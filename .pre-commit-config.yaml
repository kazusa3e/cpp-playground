repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: make clang-format-check
        language: system
        pass_filenames: false
      - id: clang-tidy
        name: clang-tidy
        entry: make clang-tidy-check
        language: system
        pass_filenames: false
